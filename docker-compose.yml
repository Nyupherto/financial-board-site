version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financial_board_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:/app/data/family_finance.db
      - JWT_SECRET=${JWT_SECRET:?Set a strong 32+ char JWT_SECRET in your .env file}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
    volumes:
      - ./data:/app/data
    networks:
      - financial_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financial_board_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - financial_network

  caddy:
    image: caddy:2-alpine
    container_name: financial_board_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - financial_network

networks:
  financial_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
